name: Autonomous Daily Evolution & Evaluation

on:
  schedule:
    # Runs everyday at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  daily-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Run Verification Suite
        run: |
          python -m unittest discover -s tests -p "*_test.py" -v || true

      - name: 📊 Execute Autonomous Benchmark
        run: |
          python scripts/daily_benchmark.py

      - name: 🚀 Commit & Push Daily Evolution
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "chore(auto): daily autonomous benchmark & evaluation update [skip ci]"
            git push origin main
          fi
