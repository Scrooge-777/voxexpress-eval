name: Evaluation Benchmark Pipeline

on:
  schedule:
    # 3 daily windows across active hours with dynamic random jitter:
    # Window 1: ~09:50 AM IST (04:20 UTC)
    - cron: '20 4 * * *'
    # Window 2: ~03:15 PM IST (09:45 UTC)
    - cron: '45 9 * * *'
    # Window 3: ~07:45 PM IST (14:15 UTC)
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-eval:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⏱️ Natural Timing Jitter
        if: github.event_name == 'schedule'
        run: |
          # Apply randomized jitter between 2 and 22 minutes (120 to 1320 seconds)
          JITTER=$(( 120 + RANDOM % 1200 ))
          echo "Applying natural timing jitter of ${JITTER}s..."
          sleep $JITTER

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: 🧪 Run Verification Suite
        run: |
          python -m unittest discover -s tests -p "*test*.py" -v

      - name: 📊 Run Benchmark Suite
        run: |
          python scripts/run_benchmark.py

      - name: 🚀 Update Evaluation Telemetry
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"
          
          # Determine today's commit count
          TODAY=$(date -u +"%Y-%m-%d")
          COMMITS_TODAY=$(git log --since="$TODAY 00:00" --author="Scrooge-777" --oneline | wc -l)
          echo "Commits completed today ($TODAY): $COMMITS_TODAY"

          SHOULD_COMMIT=true
          if [ "$COMMITS_TODAY" -ge 2 ]; then
            # If 2 commits already done today, 50% random chance for a 3rd commit
            COIN=$(( RANDOM % 2 ))
            if [ $COIN -eq 0 ]; then
              echo "Daily goal (2 commits) already met. Skipping 3rd commit for variable cadence."
              SHOULD_COMMIT=false
            else
              echo "Random selector rolled for a 3rd commit today."
            fi
          fi

          if [ "$SHOULD_COMMIT" = true ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No changes to record."
            else
              MESSAGES=(
                "chore(eval): update benchmark telemetry and score logs"
                "chore(metrics): refresh multi-axis speech evaluation logs"
                "chore(benchmark): update validation metrics and telemetry distribution"
                "chore(eval): record cross-lingual consistency and MOS regression logs"
                "chore(telemetry): update acoustic expressiveness benchmark results"
              )
              RAND_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
              COMMIT_MSG="${MESSAGES[$RAND_INDEX]}"
              echo "Committing with message: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"
              git push origin main
            fi
          fi
