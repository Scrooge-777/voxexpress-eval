name: Evaluation Benchmark Pipeline

on:
  schedule:
    # Daily benchmark run at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-eval:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Run Verification Suite
        run: |
          python -m unittest discover -s tests -p "*_test.py" -v || true

      - name: 📊 Run Benchmark Suite
        run: |
          python scripts/run_benchmark.py

      - name: 🚀 Update Evaluation Telemetry
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to record."
          else
            git commit -m "chore(eval): update benchmark telemetry and score logs"
            git push origin main
          fi
