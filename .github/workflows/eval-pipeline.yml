name: Evaluation Benchmark Pipeline

on:
  schedule:
    # Frequent check windows during active daytime (06:00 AM - 11:59 PM IST / 00:30 - 18:30 UTC)
    - cron: '35,50 0 * * *'
    - cron: '*/15 1-17 * * *'
    - cron: '0,15,30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-eval:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🌙 Night Lockout & Dynamic Timing Gate
        id: gate
        run: |
          # 1. Enforce strict quiet window: 12:00 AM to 06:00 AM IST (18:30 to 00:30 UTC)
          IST_HOUR=$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).hour)")
          echo "Current IST Hour: $IST_HOUR"

          if [ "$IST_HOUR" -ge 0 ] && [ "$IST_HOUR" -lt 6 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Quiet night window active (12:00 AM - 06:00 AM IST). Skipping run."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Dynamic skip probability for multi-hour gaps (1h to 5h breaks)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP_ROLL=$(( RANDOM % 100 ))
            # 25% chance to skip check cycle, simulating natural breaks between commit sessions
            if [ "$SKIP_ROLL" -lt 25 ]; then
              echo "Dynamic break window activated (Roll: $SKIP_ROLL < 25). Pausing until future window."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 3. Micro timing jitter (10s to 240s)
            JITTER=$(( 10 + RANDOM % 230 ))
            echo "Applying natural timing jitter of ${JITTER}s..."
            sleep $JITTER
          fi

          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: 🐍 Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📥 Install Dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: 🧪 Run Verification Suite
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m unittest discover -s tests -p "*test*.py" -v

      - name: 🚀 Execute Benchmark & Dynamic Commit Bursts
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"

          TODAY=$(date -u +"%Y-%m-%d")
          DAY_NUM=$(date -u +"%j")
          YEAR=$(date -u +"%Y")

          # 1. Deterministic daily seed (consistent throughout the day)
          DAY_SEED=$(( (10#$DAY_NUM * 41 + 10#$YEAR * 13) % 1000 ))
          MOD100=$(( DAY_SEED % 100 ))

          # Full random daily quota (5, 10, 20, 35, 60+ commits):
          # - 15% Light days: 5 to 12 commits
          # - 30% Moderate days: 15 to 30 commits
          # - 35% Active sprint days: 32 to 50 commits
          # - 20% Maximum velocity days: 52 to 65 commits
          if [ "$MOD100" -lt 15 ]; then
            TARGET_QUOTA=$(( 5 + (DAY_SEED % 8) ))
          elif [ "$MOD100" -lt 45 ]; then
            TARGET_QUOTA=$(( 15 + (DAY_SEED % 16) ))
          elif [ "$MOD100" -lt 80 ]; then
            TARGET_QUOTA=$(( 32 + (DAY_SEED % 19) ))
          else
            TARGET_QUOTA=$(( 52 + (DAY_SEED % 14) ))
          fi

          COMMITS_TODAY=$(git log --since="$TODAY 00:00" --author="Scrooge-777" --oneline | wc -l)
          echo "Date: $TODAY | Completed today: $COMMITS_TODAY / Target: $TARGET_QUOTA commits"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$COMMITS_TODAY" -ge "$TARGET_QUOTA" ]; then
            echo "Daily commit target reached ($COMMITS_TODAY >= $TARGET_QUOTA). Resting until next morning."
            exit 0
          fi

          # 2. Determine burst size for this session (1 to 4 micro-commits)
          REMAINING=$(( TARGET_QUOTA - COMMITS_TODAY ))
          if [ "$REMAINING" -le 0 ]; then
            BURST_COUNT=1
          elif [ "$REMAINING" -lt 4 ]; then
            BURST_COUNT=$(( 1 + RANDOM % REMAINING ))
          else
            BURST_COUNT=$(( 1 + RANDOM % 4 ))
          fi
          echo "Starting evaluation session with $BURST_COUNT commit(s)..."

          MESSAGES=(
            "chore(eval): update benchmark telemetry and score logs"
            "chore(metrics): refresh multi-axis speech evaluation logs"
            "chore(benchmark): update validation metrics and telemetry distribution"
            "chore(eval): record cross-lingual consistency and MOS regression logs"
            "chore(telemetry): update acoustic expressiveness benchmark results"
            "chore(stats): refresh bootstrap confidence intervals and correlation telemetry"
            "chore(eval): synchronize acoustic prosody variance and pitch velocity logs"
            "chore(benchmark): update Ridge aggregator validation metrics"
            "perf(prosody): optimize continuous F0 contour extraction filter"
            "test(wer): update phoneme-aligned CER confidence telemetry"
            "chore(telemetry): record intonation contour stability metrics"
            "test(eval): verify multi-speaker embedding distance baselines"
            "chore(metrics): update utterance length and pause duration histograms"
            "chore(eval): re-evaluate spectral tilt and vocal effort indices"
            "perf(metrics): accelerate mel-spectrogram euclidean distance pass"
            "chore(telemetry): refresh cross-corpus zero-shot MOS telemetry"
            "chore(eval): record emotional valence and arousal variance logs"
            "chore(stats): update 95% bootstrap error bounds for UTMOS regressor"
            "chore(benchmark): record fastdtw acoustic distance coefficients"
            "test(telemetry): synchronize objective speech intelligibility ratings"
            "chore(eval): update fundamental frequency RMSE tracking telemetry"
            "perf(eval): re-index phonetic alignment DTW warped matrices"
            "chore(metrics): refresh phoneme duration distribution vectors"
            "chore(eval): update dynamic range compression speech quality profile"
            "chore(telemetry): synchronize harmonic-to-noise ratio (HNR) telemetry"
            "chore(stats): update Pearson and Spearman correlation benchmarks"
          )

          for (( i=1; i<=BURST_COUNT; i++ )); do
            echo "--- Iteration $i of $BURST_COUNT ---"
            python scripts/run_benchmark.py

            git add reports/telemetry.json BENCHMARK_LOG.md
            if git diff --staged --quiet; then
              echo "No staged changes detected. Skipping commit."
            else
              RAND_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
              COMMIT_MSG="${MESSAGES[$RAND_INDEX]}"
              echo "Committing: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"

              for attempt in 1 2 3 4 5; do
                echo "Push attempt $attempt..."
                git pull --rebase origin main
                if git push origin main; then
                  echo "Successfully pushed commit to main!"
                  break
                fi
                sleep 5
              done
            fi

            # Between burst commits: pause 4 to 9 minutes (random 240s to 540s)
            if [ "$i" -lt "$BURST_COUNT" ]; then
              BURST_PAUSE=$(( 240 + RANDOM % 300 ))
              echo "Micro-gap: waiting ${BURST_PAUSE}s before next commit in burst..."
              sleep $BURST_PAUSE
            fi
          done

          echo "Evaluation session complete."
