name: Evaluation Benchmark Pipeline

on:
  schedule:
    # 12 distributed daily windows every 2 hours with dynamic random jitter:
    - cron: '15 0 * * *'
    - cron: '15 2 * * *'
    - cron: '15 4 * * *'
    - cron: '15 6 * * *'
    - cron: '15 8 * * *'
    - cron: '15 10 * * *'
    - cron: '15 12 * * *'
    - cron: '15 14 * * *'
    - cron: '15 16 * * *'
    - cron: '15 18 * * *'
    - cron: '15 20 * * *'
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-eval:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⏱️ Natural Timing Jitter
        if: github.event_name == 'schedule'
        run: |
          # Apply randomized jitter between 1 and 15 minutes (60 to 900 seconds)
          JITTER=$(( 60 + RANDOM % 840 ))
          echo "Applying natural timing jitter of ${JITTER}s..."
          sleep $JITTER

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: 🧪 Run Verification Suite
        run: |
          python -m unittest discover -s tests -p "*test*.py" -v

      - name: 📊 Run Benchmark Suite
        run: |
          python scripts/run_benchmark.py

      - name: 🚀 Update Evaluation Telemetry
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"
          
          # 1. Determine date and day-of-week metadata
          TODAY=$(date -u +"%Y-%m-%d")
          DOW=$(date -u +"%u")        # 1=Monday ... 6=Saturday, 7=Sunday
          DAY_NUM=$(date -u +"%j")    # Day of year (1-366)
          WEEK_NUM=$(date -u +"%V")   # ISO week number (1-53)
          YEAR=$(date -u +"%Y")
          
          # 2. Check today's existing commit count
          COMMITS_TODAY=$(git log --since="$TODAY 00:00" --author="Scrooge-777" --oneline | wc -l)
          echo "Date: $TODAY (Day of week: $DOW, Week: $WEEK_NUM) | Commits completed today: $COMMITS_TODAY"

          # 3. Deterministic seeds so runs within the same day/week agree
          DAY_HASH=$(( (10#$DAY_NUM * 37 + 10#$YEAR) % 100 ))
          WEEK_HASH=$(( (10#$WEEK_NUM * 19 + 10#$YEAR) % 100 ))

          # 4. Randomized daily quota calculation:
          # On Weekends (Saturday=6, Sunday=7):
          # Alternates between an authentic 2-day rest lag (0 commits) and light casual coding (1 to 5 commits)
          if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
            if [ $(( WEEK_HASH % 2 )) -eq 0 ]; then
              TARGET_QUOTA=0
              echo "Weekend 2-day rest lag detected (DOW $DOW, Week $WEEK_NUM) -> 0 commits (Authentic 2-day break)."
            else
              TARGET_QUOTA=$(( 1 + (DAY_HASH % 5) ))
              echo "Weekend light activity detected (DOW $DOW) -> $TARGET_QUOTA commits (Random 1 to 5)."
            fi
          else
            # On Weekdays:
            # ~15% chance of random mid-week rest/pause (0 commits)
            if [ $(( DAY_HASH % 7 )) -eq 0 ]; then
              TARGET_QUOTA=0
              echo "Random weekday rest lag detected -> 0 commits."
            else
              # Active weekdays: random quota from 1 to 10 commits
              TARGET_QUOTA=$(( 1 + (DAY_HASH % 10) ))
              echo "Active weekday detected -> $TARGET_QUOTA commits (Random 1 to 10)."
            fi
          fi
          echo "Final determined daily quota: $TARGET_QUOTA commits"

          # 5. Evaluate commit decision
          SHOULD_COMMIT=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch event detected: forcing commit override."
            SHOULD_COMMIT=true
          elif [ "$TARGET_QUOTA" -eq 0 ]; then
            echo "Today is a rest/lag day (quota: 0 commits). Skipping commit."
            SHOULD_COMMIT=false
          elif [ "$COMMITS_TODAY" -ge "$TARGET_QUOTA" ]; then
            echo "Daily target achieved ($COMMITS_TODAY >= $TARGET_QUOTA). Resting until next cycle."
            SHOULD_COMMIT=false
          else
            echo "Active window ($COMMITS_TODAY / $TARGET_QUOTA commits). Proceeding with evaluation commit."
            SHOULD_COMMIT=true
          fi

          if [ "$SHOULD_COMMIT" = true ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No changes to record."
            else
              MESSAGES=(
                "chore(eval): update benchmark telemetry and score logs"
                "chore(metrics): refresh multi-axis speech evaluation logs"
                "chore(benchmark): update validation metrics and telemetry distribution"
                "chore(eval): record cross-lingual consistency and MOS regression logs"
                "chore(telemetry): update acoustic expressiveness benchmark results"
                "chore(stats): refresh bootstrap confidence intervals and correlation telemetry"
                "chore(eval): synchronize acoustic prosody variance and pitch velocity logs"
                "chore(benchmark): update Ridge aggregator validation metrics"
              )
              RAND_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
              COMMIT_MSG="${MESSAGES[$RAND_INDEX]}"
              echo "Committing with message: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"
              
              # Resilient push with rebase and auto-retry
              for attempt in 1 2 3 4 5; do
                echo "Push attempt $attempt..."
                git pull --rebase origin main
                if git push origin main; then
                  echo "Successfully pushed evaluation commit to main!"
                  break
                fi
                sleep 5
              done
            fi
          fi
