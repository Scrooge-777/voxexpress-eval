name: Evaluation Benchmark Pipeline

on:
  schedule:
    # 8 distributed daily windows across 24 hours with dynamic random jitter:
    # Window 1: ~06:30 AM IST (01:00 UTC)
    - cron: '0 1 * * *'
    # Window 2: ~09:30 AM IST (04:00 UTC)
    - cron: '0 4 * * *'
    # Window 3: ~12:30 PM IST (07:00 UTC)
    - cron: '0 7 * * *'
    # Window 4: ~03:30 PM IST (10:00 UTC)
    - cron: '0 10 * * *'
    # Window 5: ~06:30 PM IST (13:00 UTC)
    - cron: '0 13 * * *'
    # Window 6: ~09:30 PM IST (16:00 UTC)
    - cron: '0 16 * * *'
    # Window 7: ~11:45 PM IST (18:15 UTC)
    - cron: '15 18 * * *'
    # Window 8: ~02:45 AM IST (21:15 UTC)
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-eval:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⏱️ Natural Timing Jitter
        if: github.event_name == 'schedule'
        run: |
          # Apply randomized jitter between 1 and 15 minutes (60 to 900 seconds)
          JITTER=$(( 60 + RANDOM % 840 ))
          echo "Applying natural timing jitter of ${JITTER}s..."
          sleep $JITTER

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: 🧪 Run Verification Suite
        run: |
          python -m unittest discover -s tests -p "*test*.py" -v

      - name: 📊 Run Benchmark Suite
        run: |
          python scripts/run_benchmark.py

      - name: 🚀 Update Evaluation Telemetry
        run: |
          git config user.name "Scrooge-777"
          git config user.email "318593710+Scrooge-777@users.noreply.github.com"
          
          # 1. Determine date and day-of-week metadata
          TODAY=$(date -u +"%Y-%m-%d")
          DOW=$(date -u +"%u")        # 1=Monday ... 6=Saturday, 7=Sunday
          DAY_NUM=$(date -u +"%j")    # Day of year (1-366)
          YEAR=$(date -u +"%Y")
          
          # 2. Check today's existing commit count
          COMMITS_TODAY=$(git log --since="$TODAY 00:00" --author="Scrooge-777" --oneline | wc -l)
          echo "Date: $TODAY (Day of week: $DOW) | Commits completed today: $COMMITS_TODAY"

          # 3. Calculate natural rest/lag days
          # Weekend rest: 2-day lag every week (Saturday & Sunday)
          IS_REST_DAY=false
          if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
            echo "Weekend detected (DOW $DOW) -> 2-day natural rest lag."
            IS_REST_DAY=true
          fi

          # Deterministic daily seed so all schedule runs within the same day agree
          DAY_HASH=$(( (10#$DAY_NUM * 37 + 10#$YEAR) % 100 ))

          # Occasional mid-week pause (roughly 1 in 8 weekdays)
          if [ "$DOW" -le 5 ] && [ $(( DAY_HASH % 8 )) -eq 0 ]; then
            echo "Occasional mid-week reading/research day detected -> natural 1-day pause."
            IS_REST_DAY=true
          fi

          # 4. Randomized daily quota for active days (varying between 1 and 6 commits)
          TARGET_QUOTA=$(( 1 + (DAY_HASH % 6) ))
          echo "Determined daily quota: $TARGET_QUOTA commits"

          # 5. Evaluate commit decision
          SHOULD_COMMIT=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch event detected: forcing commit override."
            SHOULD_COMMIT=true
          elif [ "$IS_REST_DAY" = true ]; then
            echo "Today is a rest/lag day (target: 0 commits). Skipping commit."
            SHOULD_COMMIT=false
          elif [ "$COMMITS_TODAY" -ge "$TARGET_QUOTA" ]; then
            echo "Daily target achieved ($COMMITS_TODAY >= $TARGET_QUOTA). Resting until next active day."
            SHOULD_COMMIT=false
          else
            echo "Active day ($COMMITS_TODAY / $TARGET_QUOTA commits). Proceeding with evaluation commit."
            SHOULD_COMMIT=true
          fi

          if [ "$SHOULD_COMMIT" = true ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No changes to record."
            else
              MESSAGES=(
                "chore(eval): update benchmark telemetry and score logs"
                "chore(metrics): refresh multi-axis speech evaluation logs"
                "chore(benchmark): update validation metrics and telemetry distribution"
                "chore(eval): record cross-lingual consistency and MOS regression logs"
                "chore(telemetry): update acoustic expressiveness benchmark results"
                "chore(stats): refresh bootstrap confidence intervals and correlation telemetry"
                "chore(eval): synchronize acoustic prosody variance and pitch velocity logs"
                "chore(benchmark): update Ridge aggregator validation metrics"
              )
              RAND_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
              COMMIT_MSG="${MESSAGES[$RAND_INDEX]}"
              echo "Committing with message: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"
              
              # Resilient push with rebase and auto-retry
              for attempt in 1 2 3 4 5; do
                echo "Push attempt $attempt..."
                git pull --rebase origin main
                if git push origin main; then
                  echo "Successfully pushed evaluation commit to main!"
                  break
                fi
                sleep 5
              done
            fi
          fi
